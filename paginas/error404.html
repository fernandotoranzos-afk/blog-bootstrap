<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>404 | Recetas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../css/estilos.css" />
  </head>

  <body>
    <main
      class="error-page d-flex align-items-center justify-content-center text-center vh-100"
    >
      <div>
        <div class="display-1 fw-bold">404</div>

        <!-- Icono de cubiertos válido en Bootstrap Icons -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="90"
          height="90"
          viewBox="0 0 64 64"
          fill="none"
          class="my-2"
        >
          <!-- Plato -->
          <circle
            cx="32"
            cy="32"
            r="28"
            stroke="#f5b82e"
            stroke-width="3"
            fill="none"
          />
          <circle
            cx="32"
            cy="32"
            r="20"
            stroke="#f5b82e"
            stroke-width="1.5"
            stroke-dasharray="3 3"
            fill="none"
          />

          <!-- Tenedor (cruzado de izquierda a derecha) -->
          <g transform="translate(32,32) rotate(-45) translate(-32,-32)">
            <!-- Mango -->
            <path
              d="M32 20 L32 46"
              stroke="#f5b82e"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <!-- Dientes -->
            <path
              d="M28 18 L28 26 C28 29 36 29 36 26 L36 18"
              stroke="#f5b82e"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
            />
            <path d="M30.7 18 L30.7 25" stroke="#f5b82e" stroke-width="1.5" />
            <path d="M33.3 18 L33.3 25" stroke="#f5b82e" stroke-width="1.5" />
          </g>

          <!-- Cuchillo (cruzado de derecha a izquierda) -->
          <g transform="translate(32,32) rotate(45) translate(-32,-32)">
            <!-- Mango -->
            <path
              d="M32 26 L32 46"
              stroke="#f5b82e"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <!-- Hoja -->
            <path
              d="M32 18 C32 18 36 20 36 26 L32 26 Z"
              fill="#f5b82e"
              stroke="#f5b82e"
              stroke-width="1"
              stroke-linejoin="round"
            />
          </g>
        </svg>

        <h1 class="display-6 fw-bold mt-3">Está receta aún no está lista</h1>

        <p class="lead text-secondary">
          La información que buscás todavía no tiene una página disponible.
        </p>

        <a href="/index.html" class="btn btn-dark">
          <i class="bi bi-house me-1"></i>
          Volver al inicio
        </a>
      </div>
    </main>
  </body>
</html>
