<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rolling Comidas</title>
    <!-- Primero Bootstrap: ofrece las clases listas para usar -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Después tu CSS: permite ajustar los estilos del blog -->
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg header-nav">
        <div class="container-fluid flex-wrap">
          <a class="navbar-brand img-logo" href="./index.html"> </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul
              class="navbar-nav w-100 justify-content-evenly ms-auto mb-2 mb-lg-0"
            >
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="/index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./paginas/iniciar-sesion.html"
                  >Login</a
                >
              </li>
              <li class="nav-item">
                <button
                  type="button"
                  class="btn btn-light"
                  data-bs-toggle="modal"
                  data-bs-target="#suscripcion"
                >
                  Suscripción
                </button>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./paginas/contacto.html">Contacto</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./paginas/sobre-nosotros.html"
                  >Sobre Nosotros</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./paginas/galeria-imagenes.html"
                  >Galeria de imágenes</a
                >
              </li>
            </ul>
            <form class="modal text-primary" id="suscripcion">
              <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label"
                  >Email</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="exampleFormControlInput1"
                  placeholder="Escribe tu email"
                />
              </div>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre o Apodo</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  placeholder="Escribe tu nombre o apodo"
                />
              </div>
              <div class="mb-3">
                <label for="nombre" class="form-label"
                  >Preferencias alimentarias</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="preferencias"
                  placeholder="Escribe tus preferencias alimentarias"
                />
              </div>
              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="exampleCheck1"
                />
                <label class="form-check-label" for="exampleCheck1"
                  >Deseo recibir notificaciones por email</label
                >
              </div>
              <button type="reset" class="btn btn-primary">
                Limpiar pantalla
              </button>
              <button type="submit" class="btn btn-primary">Confirmar</button>
            </form>
          </div>
          <div class="w-100">
            <p
              class="navbar-text text-center bg-light p-2 dancing-script-uniquifier"
            >
              Rolling comidas
            </p>
          </div>
        </div>
      </nav>
    </header>
    <main
      class="error-page d-flex align-items-center justify-content-center text-center vh-100"
    >
      <div>
        <div class="display-1 fw-bold">404</div>

        <!-- Icono de cubiertos válido en Bootstrap Icons -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="90"
          height="90"
          viewBox="0 0 64 64"
          fill="none"
          class="my-2"
        >
          <!-- Plato -->
          <circle
            cx="32"
            cy="32"
            r="28"
            stroke="#f5b82e"
            stroke-width="3"
            fill="none"
          />
          <circle
            cx="32"
            cy="32"
            r="20"
            stroke="#f5b82e"
            stroke-width="1.5"
            stroke-dasharray="3 3"
            fill="none"
          />

          <!-- Tenedor (cruzado de izquierda a derecha) -->
          <g transform="translate(32,32) rotate(-45) translate(-32,-32)">
            <!-- Mango -->
            <path
              d="M32 20 L32 46"
              stroke="#f5b82e"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <!-- Dientes -->
            <path
              d="M28 18 L28 26 C28 29 36 29 36 26 L36 18"
              stroke="#f5b82e"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
            />
            <path d="M30.7 18 L30.7 25" stroke="#f5b82e" stroke-width="1.5" />
            <path d="M33.3 18 L33.3 25" stroke="#f5b82e" stroke-width="1.5" />
          </g>

          <!-- Cuchillo (cruzado de derecha a izquierda) -->
          <g transform="translate(32,32) rotate(45) translate(-32,-32)">
            <!-- Mango -->
            <path
              d="M32 26 L32 46"
              stroke="#f5b82e"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <!-- Hoja -->
            <path
              d="M32 18 C32 18 36 20 36 26 L32 26 Z"
              fill="#f5b82e"
              stroke="#f5b82e"
              stroke-width="1"
              stroke-linejoin="round"
            />
          </g>
        </svg>

        <h1 class="display-6 fw-bold mt-3">Está receta aún no está lista</h1>

        <p class="lead text-secondary">
          La información que buscás todavía no tiene una página disponible.
        </p>

        <a href="/index.html" class="btn btn-dark">
          <i class="bi bi-house me-1"></i>
          Volver al inicio
        </a>
      </div>
    </main>
  </body>
</html>
