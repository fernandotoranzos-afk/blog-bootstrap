<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rolling Comidas</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Tu CSS personal -->
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>

  <!-- Usamos min-vh-100 y d-flex para que el footer quede abajo y el main ocupe el resto del alto -->
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg header-nav">
        <div class="container-fluid flex-wrap">
          <a class="navbar-brand img-logo" href="./index.html"> </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul
              class="navbar-nav w-100 justify-content-evenly ms-auto mb-2 mb-lg-0"
            >
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="../index.html"
                >
                  Inicio
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./iniciar-sesion.html">
                  Login
                </a>
              </li>

              <li class="nav-item">
                <button
                  type="button"
                  class="btn btn-light"
                  data-bs-toggle="modal"
                  data-bs-target="#suscripcion"
                >
                  Suscripción
                </button>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./contacto.html">
                  Contacto
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./sobre-nosotros.html">
                  Sobre Nosotros
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./galeria-imagenes.html">
                  Galeria de imágenes
                </a>
              </li>
            </ul>

            <!-- Modal de Suscripción -->
            <div
              class="modal fade custom-mini-modal"
              id="suscripcion"
              tabindex="-1"
              aria-hidden="true"
            >
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content bg-dark text-white p-3 rounded">
                  <div class="modal-body text-center">
                    <form>
                      <div>
                        <div class="mb-3 text-start">
                          <label
                            for="exampleFormControlInput1"
                            class="form-label"
                          >
                            Email
                          </label>
                          <input
                            type="email"
                            class="form-control"
                            id="exampleFormControlInput1"
                            placeholder="Escribe tu email"
                          />
                        </div>

                        <div class="mb-3 text-start">
                          <label for="nombre" class="form-label">
                            Nombre o Apodo
                          </label>
                          <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            placeholder="Escribe tu nombre o apodo"
                          />
                        </div>

                        <div class="mb-3 text-start">
                          <label for="preferencias" class="form-label">
                            Preferencias alimentarias
                          </label>
                          <input
                            type="text"
                            class="form-control"
                            id="preferencias"
                            placeholder="Escribe tus preferencias alimentarias"
                          />
                        </div>

                        <div class="mb-3 form-check text-start">
                          <input
                            type="checkbox"
                            class="form-check-input"
                            id="exampleCheck1"
                          />
                          <label
                            class="form-check-label"
                            for="exampleCheck1"
                          >
                            Deseo recibir notificaciones por email
                          </label>
                        </div>

                        <button type="reset" class="btn btn-primary me-2">
                          Limpiar pantalla
                        </button>
                        <button type="submit" class="btn btn-primary">
                          Confirmar
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="w-100">
            <p
              class="navbar-text text-center bg-light p-2 dancing-script-uniquifier mb-0"
            >
              Rolling comidas
            </p>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main centrado horizontal y verticalmente -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
      <div class="login-container w-100" style="max-width: 420px; padding: 0 15px;">
        <div class="login-box bg-white p-4 rounded shadow-sm text-center">
          <h1 class="h3 mb-2 fw-bold">Bienvenido</h1>
          <p class="subtitle text-muted mb-4">Inicia sesión para continuar</p>

          <form>
            <!-- Campo Correo -->
            <div class="mb-3 text-start">
              <label for="email" class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="tu@email.com"
                required
              />
            </div>

            <!-- Campo Contraseña -->
            <div class="mb-3 text-start">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>

            <!-- Opciones -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" />
                <label class="form-check-label small" for="rememberMe">
                  Recordarme
                </label>
              </div>
              <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn btn-primary w-100 mb-3">
              Iniciar sesión
            </button>
          </form>

          <p class="register small text-muted mb-0">
            ¿No tienes una cuenta?
            <a href="#" class="text-decoration-none fw-bold">Crear cuenta</a>
          </p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light py-3 mt-auto">
      <div class="container">
        <div class="row gy-4 align-items-center">
          <!-- Columna 1: Imagen / Logotipo -->
          <div class="col-12 col-md-4 text-center text-md-start">
            <img
              src="../imagenes/82517984_9886629.jpg"
              alt="Logotipo"
              class="img-fluid"
              style="max-height: 120px;"
            />
          </div>

          <!-- Columna 2: Redes Sociales -->
          <div class="col-12 col-md-4 text-center">
            <h5 class="mb-3">Síguenos</h5>
            <div class="d-flex justify-content-center gap-4 fs-4">
              <a
                href="https://facebook.com"
                class="text-dark"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="../imagenes/face.png"
                  alt="Facebook"
                  style="max-height: 30px;"
                />
              </a>

              <a
                href="https://instagram.com"
                class="text-dark"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="../imagenes/insta.png"
                  alt="Instagram"
                  style="max-height: 30px;"
                />
              </a>

              <a
                href="https://twitter.com"
                class="text-dark"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="../imagenes/twitter.png"
                  alt="Twitter"
                  style="max-height: 30px;"
                />
              </a>
            </div>
          </div>

          <!-- Columna 3: Enlaces de Interés o Contacto -->
          <div class="col-12 col-md-4 text-center text-md-end">
            <h5 class="mb-3">Contacto</h5>
            <ul class="list-unstyled small text-muted mb-0">
              <li class="mb-2">
                <i class="bi bi-envelope-fill me-2"></i>
                rollingcomidas@gmail.com
              </li>
              <li class="mb-2">
                <i class="bi bi-telephone-fill me-2"></i>
                +54 9 381 666 6666
              </li>
              <li>
                <i class="bi bi-geo-alt-fill me-2"></i>
                Tucumán, Argentina
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>

    <!-- Script Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
